# Builds the images and the Workers a push changed and leaves them in the artifacts bucket under
# this run, RFC q28g5. Nothing is published and nothing here reaches a machine or Cloudflare: when
# the run ends, GitHub's webhook tells the nodes and the deployer, and each fetches and checks what
# was built. See infra's spec/architecture/host.md and spec/architecture/deployer.md.
name: Deploy

on:
  push:
    branches: [main]
  # The first of each month rebuilds geo, whose image fetches GeoNames as it is built.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build, space-separated; empty for every one"
        required: false
        default: ""

permissions:
  contents: read
  # For `deploy-base` to read which run last succeeded.
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      declared: ${{ steps.plan.outputs.declared }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # cargo, for `deployable` to ask what each image's crate compiles once Cargo.lock moved: the
      # workspace's compiler at its minimal profile, no target added, since `cargo tree --target`
      # needs none installed, and the registry it reads, kept between runs. Without them it keeps
      # the lockfile's answer, which is wider. See .mise/tasks/resolved.py.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
          path: .workspace
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' .workspace/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ASKED: ${{ inputs.apps }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declared='[]'
          if [ "$EVENT" = schedule ]; then
            apps='["geo"]'
            workers='[]'
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$ASKED" ]; then
            # The asked apps that have an image, and the asked ones that are Workers: a name that is
            # one alone asks for nothing of the other.
            apps="$(.mise/tasks/deployable --all | python3 -c 'import json,os,sys; asked=os.environ["ASKED"].split(); print(json.dumps([a for a in json.load(sys.stdin) if a in asked]))')"
            workers="$(.mise/tasks/deployable --workers --all | python3 -c 'import json,os,sys; asked=os.environ["ASKED"].split(); print(json.dumps([w for w in json.load(sys.stdin) if w in asked]))')"
          elif [ "$EVENT" = workflow_dispatch ]; then
            apps="$(.mise/tasks/deployable --all)"
            workers="$(.mise/tasks/deployable --workers --all)"
          else
            # Against what the last push's run built, not `before`: a pending run cancelled by a
            # newer push leaves `before` past what it never built. It says which base, and why.
            base="$(.mise/tasks/deploy-base)"
            if [ -z "$base" ]; then
              apps="$(.mise/tasks/deployable --all)"
              workers="$(.mise/tasks/deployable --workers --all)"
            else
              apps="$(.mise/tasks/deployable --git "$base")"
              declared="$(.mise/tasks/deployable --declared --git "$base")"
              workers="$(.mise/tasks/deployable --workers --git "$base")"
            fi
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "declared=$declared" >> "$GITHUB_OUTPUT"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "building: $apps"
          echo "declaring alone: $declared"
          echo "packaging: $workers"

  # Every declaration the run builds an image for, apart and small, so a node reads where an app
  # is placed, and in which architecture, before it downloads any image; and every declaration
  # changed alone, which a node applies over the image it already runs. See infra's
  # spec/architecture/host.md, "The machine pulls; nothing pushes into it".
  declare:
    needs: plan
    if: needs.plan.outputs.apps != '[]' || needs.plan.outputs.declared != '[]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - env:
          APPS: ${{ needs.plan.outputs.apps }}
          DECLARED: ${{ needs.plan.outputs.declared }}
        run: |
          mkdir -p "$RUNNER_TEMP/declarations"
          for app in $(printf '%s\n%s' "$APPS" "$DECLARED" | python3 -c 'import json,sys; print(" ".join(a for line in sys.stdin for a in json.loads(line)))'); do
            cp apps/*/"$app"/service.toml "$RUNNER_TEMP/declarations/$app.toml"
          done
      # The workspace's mise.toml alone, for the Node it pins, which runs the artifact script.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
          path: .workspace
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' .workspace/mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      # Into the artifacts bucket under this run; see RFC q28g5.
      - env:
          ARTIFACTS_ENDPOINT: ${{ vars.ARTIFACTS_ENDPOINT }}
          ARTIFACTS_REGION: ${{ vars.ARTIFACTS_REGION }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ARTIFACTS_VIRTUAL_HOST: ${{ vars.ARTIFACTS_VIRTUAL_HOST }}
          ARTIFACTS_WRITE_KEY_ID: ${{ secrets.ARTIFACTS_WRITE_KEY_ID }}
          ARTIFACTS_WRITE_SECRET: ${{ secrets.ARTIFACTS_WRITE_SECRET }}
        run: node .mise/tasks/artifact.ts declarations "$RUNNER_TEMP/declarations"

  build:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
        arch: [arm64, amd64]
        # Each arch builds natively on its own runner; the include entries only attach the runner.
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      # The workspace above the project, as it is checked out at home: its rust-toolchain.toml is
      # the compiler every image is built with.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/platform
      # The runner's default builder cannot export an image as an archive; a container builder can.
      - uses: docker/setup-buildx-action@v4
      # The runtime's cache credentials, for sccache, which only an action is handed; see infra's
      # spec/architecture/host.md, "An image is built for speed, and for any node of its
      # architecture".
      - uses: crazy-max/ghaction-github-runtime@v4
      - env:
          APP: ${{ matrix.app }}
          PLATFORM: linux/${{ matrix.arch }}
          SCCACHE_GHA_ENABLED: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          repos/platform/.mise/tasks/image "$APP" "$RUNNER_TEMP/deploy/image.tar"
          cp repos/platform/apps/*/"$APP"/service.toml "$RUNNER_TEMP/deploy/"
      # The Node the workspace pins, which runs the artifact script.
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      # The image layers are compressed already, so the zip stores them. After it, the image's
      # runs older than the newest two leave the bucket; see RFC q28g5.
      - env:
          ARTIFACTS_ENDPOINT: ${{ vars.ARTIFACTS_ENDPOINT }}
          ARTIFACTS_REGION: ${{ vars.ARTIFACTS_REGION }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ARTIFACTS_VIRTUAL_HOST: ${{ vars.ARTIFACTS_VIRTUAL_HOST }}
          ARTIFACTS_WRITE_KEY_ID: ${{ secrets.ARTIFACTS_WRITE_KEY_ID }}
          ARTIFACTS_WRITE_SECRET: ${{ secrets.ARTIFACTS_WRITE_SECRET }}
          NAME: deploy-${{ matrix.app }}-${{ matrix.arch }}
        run: node repos/platform/.mise/tasks/artifact.ts "$NAME" "$RUNNER_TEMP/deploy" --store

  # A Worker is one artifact for every architecture: wrangler's bundle, its assets, its declaration
  # and its resolved config, packaged without a credential. Nothing deploys it here; until a Worker
  # is moved onto the deployer, Cloudflare's Git integration still does. See
  # spec/architecture/deployer.md, "What a Worker artifact is".
  worker:
    needs: plan
    if: needs.plan.outputs.workers != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.workers) }}
    steps:
      # The workspace above the project, as for an image: its mise.toml pins the Node it builds on.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/platform
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      - working-directory: repos/platform
        env:
          APP: ${{ matrix.app }}
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          app="$(find apps -mindepth 2 -maxdepth 2 -type d -name "$APP" | head -n 1)"
          pnpm install --frozen-lockfile --filter "{./$app}..."
          .mise/tasks/worker "$APP" "$RUNNER_TEMP/worker"
      # Hidden files included: SvelteKit's `.assetsignore` keeps its Worker out of the assets.
      # After it, the Worker's runs older than the newest two leave the bucket; see RFC q28g5.
      - env:
          ARTIFACTS_ENDPOINT: ${{ vars.ARTIFACTS_ENDPOINT }}
          ARTIFACTS_REGION: ${{ vars.ARTIFACTS_REGION }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ARTIFACTS_VIRTUAL_HOST: ${{ vars.ARTIFACTS_VIRTUAL_HOST }}
          ARTIFACTS_WRITE_KEY_ID: ${{ secrets.ARTIFACTS_WRITE_KEY_ID }}
          ARTIFACTS_WRITE_SECRET: ${{ secrets.ARTIFACTS_WRITE_SECRET }}
          NAME: worker-${{ matrix.app }}
        run: node repos/platform/.mise/tasks/artifact.ts "$NAME" "$RUNNER_TEMP/worker" --hidden
