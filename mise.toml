[env]
# Credentials, decrypted by mise on entering the directory. The file is committed encrypted; only
# the age private key opens it -- see the workspace's spec/toolchain.md, "Secrets".
_.file = "secrets.json"

# oxfmt lives in package.json rather than [tools]: its svelte option resolves `svelte/compiler`
# through node's module graph, which a mise-installed binary can never reach. This keeps what pnpm
# carries invocable from the shell and from `jj fix`.
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.test]
description = "Run every test in the workspace"
run = "node {{config_root}}/../../.mise/tasks/gates/test.ts"

[tasks.test-tasks]
description = "Run the tests of this repository's own tasks, the `*_test.py` beside them"
run = "node {{config_root}}/../../.mise/tasks/gates/test-tasks.ts"

[tasks.check]
description = "Type check every package, in each runtime context"
# Three programs, because workerd, the browser and bare node declare different things under the
# same names; each tsconfig says which is which.
run = [
	"pnpm exec tsc -p tsconfig.json --noEmit",
	"pnpm exec tsc -p tsconfig.workers.json --noEmit",
	"pnpm exec tsc -p tsconfig.scripts.json --noEmit",
]

[tasks.lint]
description = "Lint the workspace"
run = "node {{config_root}}/../../.mise/tasks/gates/lint.ts ."

[tasks.test-rust]
description = "Run the Rust test suites"
run = "node {{config_root}}/../../.mise/tasks/gates/test-rust.ts"

[tasks.lint-rust]
description = "Lint the Rust crates"
run = "node {{config_root}}/../../.mise/tasks/gates/lint-rust.ts"

[tasks.cf-login]
description = "Authenticate wrangler with Cloudflare (interactive)"
dir = "apps/delivery/cdn"
run = "pnpm exec wrangler login"

[tasks.deploy-aka]
description = "Deploy the alias layer's worker, which resolves names and stores nothing"
dir = "apps/delivery/aka"
# `--env=""` for the same reason the CDN passes it, even though this worker declares no
# environment: naming the top level explicitly means a dev environment added later cannot
# change which one a bare deploy picks.
run = 'pnpm exec wrangler deploy --env=""'

[tasks.deploy-cdn]
description = "Deploy the CDN worker"
dir = "apps/delivery/cdn"
# `--env=""` names the top-level environment explicitly. Defining any environment makes wrangler
# refuse to guess, and here it would be guessing between production and the dev config that
# mounts the objects tree as assets -- picking wrong uploads every one of those files.
run = 'pnpm exec wrangler deploy --env=""'

[tasks.dev-gateway]
description = "Run the API host, which reaches whichever services are running"
dir = "apps/edge/gateway"
run = "pnpm run dev"

[tasks.dev-cdn]
description = "Run the CDN worker against the local objects tree"
dir = "apps/delivery/cdn"
run = "pnpm run dev"

[tasks.dev-quota]
description = "Run the buckets every limit is counted in, for a gateway or the site beside it"
dir = "apps/edge/quota"
run = "pnpm run dev"

[tasks.dev-aka]
description = "Run the alias layer's worker, which resolves names and stores nothing"
dir = "apps/delivery/aka"
run = "pnpm run dev"

[tasks.check-probe]
description = "Fail when the status schema changed and its migrations were not generated again"
run = "pnpm --filter @monoflake/probe run check"

[tasks.urls]
description = "Regenerate the Rust and Python halves of libs/sdk; canmi's is the lib repository's"
# Formatted here rather than left for the next `cargo fmt`, so the file this writes is the file
# that gets committed. The generator emits one constant per line and rustfmt wraps the long ones,
# so skipping this step means the mirror changes shape after it is generated.
run = [
	"node libs/sdk/scripts/rust.ts",
	"cargo fmt -- libs/sdk/src/lib.rs",
	"node libs/sdk/scripts/python.ts",
]

[tasks.check-scopes]
description = "Fail when the gateway's table no longer matches the services' declarations"
run = "node apps/edge/gateway/scripts/scopes.ts --check"

[tasks.scopes]
description = "Regenerate the public API host's scope table from every service.toml"
# Formatted for the reason `urls` is: so the file this writes is the file that gets committed.
run = ["node apps/edge/gateway/scripts/scopes.ts", "pnpm exec oxfmt apps/edge/gateway/src/scopes.ts"]

[tasks.check-receivers]
description = "Fail when the hook's list of the deployer's nodes no longer matches its declaration"
run = "node apps/edge/hook/scripts/receivers.ts --check"

[tasks.receivers]
description = "Regenerate the hook's list of the nodes the deployer is placed on, from its service.toml"
run = "node apps/edge/hook/scripts/receivers.ts"

[tasks.platform]
description = "Manage every kind the registry holds, read off its catalog: `platform <kind> list|get|create|patch [name-or-id] [--set field=value] [--json field=<json>] [--unset field] [--<item> <key>[,field=value...]] [--json] [--dry-run]`"
run = "node apps/data/registry/scripts/platform.ts"

[tasks.catalog]
description = "Regenerate control's catalog's TypeScript reader from its committed schema, with web's generator"
run = "node ../web/apps/console/scripts/contracts.ts --schema apps/control/control/catalog.schema.json --reader apps/control/control/src/catalog.gen.ts --again 'mise run catalog'"

[tasks.check-catalog]
description = "Fail when control's catalog's TypeScript reader no longer matches its schema; passed over, named, where web is not cloned beside this"
run = """
if [ -f ../web/apps/console/scripts/contracts.ts ]; then
	node ../web/apps/console/scripts/contracts.ts --check --schema apps/control/control/catalog.schema.json --reader apps/control/control/src/catalog.gen.ts --again 'mise run catalog'
else
	echo "check-catalog: web is not cloned beside this; the catalog's reader is not checked" >&2
fi
"""

[tasks.fmt]
description = "Format the Rust and the TypeScript, Svelte, JSON and prose, with jj.toml's formatters: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List the files that would change and write nothing"'
run = "node {{config_root}}/../../.mise/tasks/gates/fmt.ts"

[tasks.update]
description = "Move the crates, the packages and this repository's own tools within their ranges, and name what waits beyond: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Cross the ranges Cargo.toml and package.json declare"
'''
run = "node {{config_root}}/../../.mise/tasks/gates/update.ts"

# Gates every repository runs the same, from the workspace's .mise/tasks/gates; what is
# this repository's own is the arguments each is given. RFC 17b3o.
[tasks.secrets]
description = "Refuse to let a plaintext secrets file exist"
run = "node {{config_root}}/../../.mise/tasks/gates/secrets.ts"

[tasks.comments]
description = "Hold every comment block to the length and width the house rules give it"
run = "node {{config_root}}/../../.mise/tasks/gates/comments.ts"

[tasks.clean]
description = "Remove what cargo and the JavaScript tools built, never an installed dependency or local state: `clean [--dry-run]`"
usage = '''
flag "-n --dry-run" help="List what would go and remove nothing"
'''
run = "node {{config_root}}/../../.mise/tasks/gates/clean.ts"

[tasks.outdated]
description = "What waits beyond the packages' ranges, judged by the newest version the workspace holds: `outdated [--names]`"
usage = '''
flag "--names" help="Print only the names `update --major` should move, one a line"
'''
run = "node {{config_root}}/../../.mise/tasks/gates/outdated.ts"
