# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See infra's spec/architecture/host.md.
version = 1
name = "ledger"
display_name = "Task Ledger"
# The three cores, one scheduler acting on the node that leads the database: each copy asks its own
# node's Patroni, `PATRONI_PRIMARY_URL`, which `mise run database grant platform ledger` writes
# beside `DATABASE_URL` for every node named here. See spec/architecture/ledger.md, "The scheduler,
# the lease and the fence".
placements = ["tyo", "sin", "rdu"]
# Deployed by hand: the version a run would deploy needs the `DATABASE_URL` that only `mise run
# database grant` makes. See spec/architecture/databases.md, "Where it runs, and which one writes".
rollout = "manual"

[container]
# One above keeper's 11010 and host's 11011, in the same low block, since ledger is the platform's
# own kind of record too. See spec/architecture/services.md, "A service keeps one port".
port = 12010
health = "/health"
memory_mb = 64

# Only the SQLite it kept before, for `ledger import /data/ledger.db`; given up once imported.
[data]
path = "/data"

# The `ledger` scope of the API host, never in the gateway's table: services write to it through
# Caddy on api.internal.ixc.one/ledger. See spec/architecture/ledger.md, "Pushed to, never asking".
[api]
public = false

# Never kept: a list read through the gateway was served up to fifteen minutes old, and a task just
# written looked lost. See spec/architecture/ledger.md, "Pushed to, never asking".
[api.defaults.cache.success]
fulfilled = "none"
redirected = "none"

[api.defaults.cache.failure]
rejected = "none"
faulted = "none"
