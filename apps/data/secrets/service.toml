# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See infra's spec/architecture/host.md.
version = 1
name = "secrets"
display_name = "Secrets"
# The three cores, each holding one share of the root key; its data is in the cluster, reached by
# the `DATABASE_URL` that `mise run database grant platform secrets` writes. See RFC 231yq.
placements = ["tyo", "sin", "rdu"]
# Deployed by hand, as the registry is: the version a run would deploy needs the `DATABASE_URL`
# that only `mise run database grant` makes, and the cores restarted together leave none holding
# the key to open another.
rollout = "manual"

[container]
# One above the registry's 12013, in the platform's own low block. See
# spec/architecture/services.md, "A service keeps one port".
port = 12014
health = "/health"
memory_mb = 64
# The node's /data/seal, read-only at /seal: host's `seal` role, granted to the cores as
# `secrets:seal`. See infra's spec/architecture/host.md.
seal = true

# Published on the machine for the other cores and every node's host, firewalled to the tailnet.
# See infra's spec/architecture/host.md, "A role is asked for by the app and granted by the node".
[shape]
kind = "peer"
