[package]
name = "secrets-service"
version = "0.0.0"
description = "The platform's secrets, sealed by a key two of the three cores rebuild."
keywords = ["secrets", "shamir", "platform"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "secrets"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
deadpool-postgres = "0.14.2"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hex = "0.4.3"
jiff = { version = "0.2", features = ["serde"] }
mimalloc = "0.1.52"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
response = { version = "2.1.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-jiff-0_2"] }
# Shamir over GF(256) alone: the curves, big integers and random identifiers it can also do are
# left out.
vsss-rs = { version = "6.0.1", default-features = false, features = ["std", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }
