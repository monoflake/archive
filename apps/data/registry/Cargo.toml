[package]
name = "registry-service"
version = "0.0.0"
description = "The platform's own record of its nodes."
keywords = ["registry", "nodes", "platform"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "registry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
deadpool-postgres = "0.14.2"
jiff = { version = "0.2", features = ["serde"] }
mimalloc = "0.1.52"
response = { version = "2.0.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-jiff-0_2"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }
