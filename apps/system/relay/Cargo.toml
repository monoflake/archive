[package]
name = "relay"
version = "0.0.0"
description = "Every node's live state, on every node."
keywords = ["relay", "mesh", "websocket"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
# Control over HTTPS, with roots compiled in, as infra's libs/deploy has it; see src/egress.rs.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
jiff = { version = "0.2", features = ["serde"] }
mimalloc = "0.1.52"
monoflake = { path = "../../../libs/sdk" }
response = { version = "2.2.0", features = ["axum"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The version axum's `ws` is built on, so the two ends of the mesh share one tungstenite.
tokio-tungstenite = "0.29"
tower-service = "0.3.3"
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }
url = "2.5.8"
# A snapshot's digest, which two relays compare to know they hold the same one; see src/delta.rs.
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# The mesh's frames, a zstd stream per direction of each connection; see src/compression.rs.
zstd-safe = { version = "7.3.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
